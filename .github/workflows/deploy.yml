name: Deploy to GitHub Pages

# 仅手动触发:在仓库 Actions 页选择本工作流 → Run workflow。
# 不会因每次 push 自动触发。
# 注意:GitHub 仓库 Settings → Pages → Source 需选择 "GitHub Actions",
# 部署产物中的 public/CNAME 会自动配置自定义域名。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run generate

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: nuxt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
